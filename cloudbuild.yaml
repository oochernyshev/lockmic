# Cloud Build → Firebase Hosting (static site)
#
# Auto-deploy: create a trigger on branch `main` that uses THIS file.
# Do NOT use Buildpacks / Autodetect / Dockerfile (no package.json → exit 21).
#
# ── One-time setup (project lockmic-11c1a) ─────────────────────────────
#
# 1) Enable APIs (in GCP project = Firebase project):
#      gcloud config set project lockmic-11c1a
#      gcloud services enable cloudbuild.googleapis.com secretmanager.googleapis.com firebase.googleapis.com firebasehosting.googleapis.com
#
# 2) Grant Cloud Build SA Hosting admin:
#      PROJECT_ID=lockmic-11c1a
#      PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/firebasehosting.admin"
#      # also helpful:
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/firebase.admin"
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/serviceusage.serviceUsageConsumer"
#
# 3) Connect GitHub repo in Cloud Build (1st time):
#      Console → Cloud Build → Repositories → Connect repository
#      → GitHub (Cloud Build GitHub App) → oochernyshev/lockmic
#
# 4) Create trigger:
#      Console → Cloud Build → Triggers → Create trigger
#        Name:                 deploy-firebase-hosting
#        Event:                Push to a branch
#        Source:               oochernyshev/lockmic
#        Branch:               ^main$
#        Configuration:        Cloud Build configuration file (yaml or json)
#        Location:             Repository
#        Cloud Build config:   cloudbuild.yaml
#        (optional) Included files filter: website/**,firebase.json,.firebaserc,cloudbuild.yaml
#
# 5) Test:
#      gcloud config set project lockmic-11c1a
#      gcloud builds submit --config cloudbuild.yaml .
#    Or push to main.
#
# Deploy uses Application Default Credentials (Cloud Build service account).
# No FIREBASE_TOKEN secret required if IAM above is set.

substitutions:
  _FIREBASE_PROJECT: "lockmic-11c1a"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-site"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        echo "GCP project=$${PROJECT_ID:-}  Firebase target=${_FIREBASE_PROJECT}"
        test -f website/public/index.html
        test -f website/public/styles.css
        test -f website/public/main.js
        test -d website/public/assets
        test -f firebase.json
        echo "Site OK: $$(find website/public -type f | wc -l) files"

  - name: "node:22-bookworm"
    id: "firebase-deploy"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        npm install -g firebase-tools@13
        # ADC = Cloud Build service account (roles/firebasehosting.admin required)
        firebase deploy \
          --only hosting \
          --project "${_FIREBASE_PROJECT}" \
          --non-interactive \
          --force

timeout: "600s"
