# Cloud Build → Firebase Hosting (LockMic landing page)
#
# Prerequisites (one-time):
#   1. Create a Firebase project and enable Hosting.
#   2. Set .firebaserc project id (default: "lockmic").
#   3. Create a CI token:  firebase login:ci
#   4. Store it as Secret Manager secret FIREBASE_TOKEN (or substitute your secret name).
#   5. Grant the Cloud Build service account roles:
#        - Firebase Hosting Admin (or Firebase Admin)
#        - Secret Manager Secret Accessor
#
# Trigger example (GitHub):
#   Cloud Build → Triggers → push to main → cloudbuild.yaml
#   Substitution _FIREBASE_PROJECT optional (defaults to Firebase project linked to GCP project).
#
# Manual:
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _FIREBASE_PROJECT: "lockmic"
  # Path to firebase-tools if not using the community image below
  _SITE_DIR: "website/public"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Sanity-check the static site is present
  - name: "gcr.io/cloud-builders/gcloud"
    id: "verify-site"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        test -f website/public/index.html
        test -f website/public/styles.css
        test -f website/public/main.js
        test -d website/public/assets
        echo "Site OK: $$(find website/public -type f | wc -l) files"

  # Deploy with Firebase CLI (Node)
  - name: "node:22"
    id: "firebase-deploy"
    entrypoint: "bash"
    secretEnv: ["FIREBASE_TOKEN"]
    args:
      - "-c"
      - |
        set -euo pipefail
        npm install -g firebase-tools@13
        firebase deploy \
          --only hosting \
          --project "${_FIREBASE_PROJECT}" \
          --non-interactive \
          --force

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_TOKEN/versions/latest
      env: "FIREBASE_TOKEN"

timeout: "600s"
