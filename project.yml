name: LockMic
options:
  bundleIdPrefix: com.lockmic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "120"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: LockMic
targets:
  LockMic:
    type: application
    platform: macOS
    sources:
      - path: Sources/LockMic
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockmic.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LockMic.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "120"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    # Do not use `info.properties` — XcodeGen rewrites Info.plist and drops keys.
