name: LockMic
options:
  bundleIdPrefix: com.lockmic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultLocalization: en
  # One `xx.lproj` per language under Resources/Localization/
  localizations:
    - en
    - cs
    - da
    - de
    - el
    - es
    - fi
    - fr
    - hu
    - it
    - ja
    - ko
    - nb
    - nl
    - pl
    - pt
    - ro
    - ru
    - sr
    - sv
    - tr
    - uk
    - zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.3.3"
    CURRENT_PROJECT_VERSION: "133"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: LockMic
    DEVELOPMENT_LANGUAGE: en
targets:
  LockMic:
    type: application
    platform: macOS
    sources:
      - path: Sources/LockMic
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # Per-language: Resources/Localization/<lang>.lproj/Localizable.strings
      - path: Resources/Localization
        buildPhase: resources
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockmic.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LockMic.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.3.3"
        CURRENT_PROJECT_VERSION: "133"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Prefer classic .strings files (not String Catalog)
        SWIFT_EMIT_LOC_STRINGS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    # Do not use `info.properties` — XcodeGen rewrites Info.plist and drops keys.
